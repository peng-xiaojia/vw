[workspace]
resolver = "2"
members = [
    "crates/vw-protocol",
    "crates/vw-core",
    "crates/vw-plugin-host",
    "crates/vw-plugin-sdk",
    "crates/vw-conformance",
    "crates/vw-cli",
    "crates/vw-mcp",
    "crates/vw-std",
    "plugins/text",
    "plugins/markdown",
    "plugins/json",
    "plugins/csv",
    "plugins/hex",
    "plugins/image",
    "plugins/pdf",
    "plugins/office",
    "plugins/dir",
    "plugins/archive",
    "plugins/example-sidecar",
    "plugins-heavy/vw-parquet-sidecar",
    "tools/wry-probe",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
pulldown-cmark = { version = "0.10", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
sha2 = "0.10"
parquet = { version = "54", default-features = false, features = ["snap", "brotli", "flate2"] }
vw-protocol = { path = "crates/vw-protocol" }
vw-core = { path = "crates/vw-core" }
vw-plugin-host = { path = "crates/vw-plugin-host" }
vw-plugin-sdk = { path = "crates/vw-plugin-sdk" }
vw-conformance = { path = "crates/vw-conformance" }
vw-std = { path = "crates/vw-std" }
vw-plugin-text = { path = "plugins/text" }
