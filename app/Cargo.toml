[package]
name = "vw-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vw GUI 外壳（Tauri 2）"

[lib]
name = "vw_app"
path = "src/lib.rs"

[[bin]]
name = "vw-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
vw-protocol = { workspace = true }
vw-core = { workspace = true }
vw-std = { workspace = true }
vw-plugin-dir = { path = "../plugins/dir" }
vw-plugin-markdown = { path = "../plugins/markdown" }
tauri-plugin-single-instance = "2"
rfd = "0.15"
percent-encoding = "2"
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
winreg = "0.55"
image = { version = "0.25", default-features = false, features = ["png"] }
blake3 = { workspace = true }

[dev-dependencies]
vw-plugin-text = { workspace = true }
zip = { workspace = true }
vw-plugin-archive = { path = "../plugins/archive" }
